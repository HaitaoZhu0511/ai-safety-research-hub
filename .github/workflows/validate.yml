name: Validate research materials
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install schema test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate metadata and local links
        run: python scripts/validate.py
      - name: Test safety controls, contracts and metadata
        run: python -m unittest discover -s tests -v
      - name: Run synthetic control suite
        run: python scripts/run_evals.py
      - name: Run offline approval and audit demo
        run: python scripts/run_demo.py
      - name: Verify hypothetical cost calculator
        run: python scripts/cost_model.py
